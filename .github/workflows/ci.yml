name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore EventsApi.sln

      - name: Verify formatting
        run: dotnet format EventsApi.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build EventsApi.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test EventsApi.sln --configuration Release --no-build

  smoke:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Docker smoke test
        run: bash scripts/smoke-test.sh

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Docker services
        if: always()
        run: docker compose down --volumes
