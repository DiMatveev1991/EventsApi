x-jwt-settings: &jwt-settings
  Jwt__Secret: ${JWT_SECRET:-local-development-secret-change-me-32-bytes}
  Jwt__Issuer: EventsSystem
  Jwt__Audience: EventsSystem.Clients

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: ruok
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost 2181 20"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

  users-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - users-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  events-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: events_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - events-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d events_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  bookings-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookings_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - bookings-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookings_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  users-api:
    build:
      context: .
      dockerfile: src/Services/Users/Users.Presentation/Dockerfile
    depends_on:
      users-db:
        condition: service_healthy
    environment:
      <<: *jwt-settings
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__UsersDatabase: Host=users-db;Port=5432;Database=users_db;Username=postgres;Password=postgres
    ports:
      - "5001:8080"

  events-api:
    build:
      context: .
      dockerfile: src/EventsApi.Presentation/Dockerfile
    depends_on:
      events-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *jwt-settings
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__EventsDatabase: Host=events-db;Port=5432;Database=events_db;Username=postgres;Password=postgres
      Kafka__BootstrapServers: kafka:29092
      Kafka__ConsumerGroup: events-service
    ports:
      - "5002:8080"

  bookings-api:
    build:
      context: .
      dockerfile: src/Services/Bookings/Bookings.Presentation/Dockerfile
    depends_on:
      bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *jwt-settings
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__BookingsDatabase: Host=bookings-db;Port=5432;Database=bookings_db;Username=postgres;Password=postgres
      Kafka__BootstrapServers: kafka:29092
    ports:
      - "5003:8080"

volumes:
  users-data:
  events-data:
  bookings-data:
